name: Feature request
description: Propose a change to contracts, the TypeScript SDK, the console, or a protocol adapter.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Never paste secrets, private keys, seed phrases, or `.env` values.

        Vaulthropic stays non-custodial. A proposal must not ask the repository to hold user keys, pool funds, or sign without the owner.

        For a suspected vulnerability, open a security advisory instead of this form: https://github.com/vaulthropic/vaulthropic/security/advisories/new
  - type: dropdown
    id: area
    attributes:
      label: Package / area
      description: Which part of the repository would change?
      options:
        - contracts
        - sdk
        - console
        - adapters
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: Who is blocked, and what they need from the current contracts, SDK, console, or adapter.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out-of-scope notes
      description: What this proposal is not asking to change. Call out custody, pooled funds, commercial pricing, or operator tooling when those are nearby. Write "None" when nothing is excluded.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should change, and which contract, package, or console surface should own it.
    validations:
      required: true
