name: Bug report
description: Report a defect in contracts, the TypeScript SDK, the console, or a protocol adapter.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Never paste secrets, private keys, seed phrases, or `.env` values.

        For a suspected vulnerability, open a security advisory instead of this form: https://github.com/vaulthropic/vaulthropic/security/advisories/new
  - type: dropdown
    id: area
    attributes:
      label: Package / area
      description: Which part of the repository is affected?
      options:
        - contracts
        - sdk
        - console
        - adapters
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What the contract, SDK, console, or adapter should have done.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, including the error text or the wrong decision, amount, or screen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Commands or the console path. Contract reports can cite `forge test`. SDK and console reports can cite `pnpm test` or `pnpm lint`.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out-of-scope notes
      description: What this report is not asking to change. Include commercial pricing, custody, or operator tooling when those are nearby but not part of the defect. Write "None" when nothing is excluded.
    validations:
      required: true
