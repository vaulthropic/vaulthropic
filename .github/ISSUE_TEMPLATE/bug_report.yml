name: Bug report
description: Report a defect in the smart contracts, TypeScript SDK, console, or MCP, x402, and USDC adapters.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe a defect you can reproduce.

        Do not include private keys, seed phrases, `.env` values, tokenized RPC URLs, or customer data.

        For a suspected vulnerability, open a [security advisory](https://github.com/vaulthropic/vaulthropic/security/advisories/new) instead of this form. The private report path is also described in `docs/SECURITY.md`.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the repository is affected?
      options:
        - Smart Contracts / Foundry
        - TypeScript SDK
        - Console / UI
        - MCP / x402 / USDC
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What failed, including the error text or the wrong decision, amount, or screen.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected the contract, package, or console to do.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command or the console path. Contract reports can cite `forge test`. SDK and console reports can cite `pnpm test`, `pnpm lint`, or the page you opened.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: A commit SHA, a release tag, or main.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste redacted command output or a short trace. Leave this empty when you have none.
    validations:
      required: false
